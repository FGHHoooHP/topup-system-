<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>KBank Topup</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080b12;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 420px;
    max-width: 94%;

    background: #10141d;

    border: 1px solid #242b3a;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

h1 {
    margin: 0 0 20px;
    text-align: center;
}

.balance {
    background: #171d29;

    border-radius: 14px;

    padding: 20px;

    text-align: center;

    margin-bottom: 20px;
}

.balance-title {
    color: #9ca3af;
    font-size: 14px;
}

.balance-value {
    font-size: 32px;
    font-weight: bold;
    margin-top: 8px;
}

input[type="number"] {

    width: 100%;

    padding: 13px;

    border-radius: 10px;

    border: 1px solid #30394b;

    background: #0b0f17;

    color: white;

    outline: none;

    font-size: 16px;
}

button {

    width: 100%;

    margin-top: 12px;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.qr-box {

    display: none;

    margin-top: 20px;

    text-align: center;

    background: #171d29;

    border-radius: 14px;

    padding: 18px;
}

.qr-box img {

    width: 260px;

    max-width: 100%;

    background: white;

    padding: 10px;

    border-radius: 10px;
}

.receiver {

    margin-top: 15px;

    font-size: 14px;

    color: #cbd5e1;

    line-height: 1.8;
}

.upload-box {

    display: none;

    margin-top: 20px;
}

input[type="file"] {

    width: 100%;

    margin-top: 10px;

    color: #cbd5e1;
}

.status {

    margin-top: 15px;

    text-align: center;

    font-size: 14px;

    color: #94a3b8;

    min-height: 20px;
}

.success {
    color: #22c55e;
}

.error {
    color: #ef4444;
}

</style>

</head>

<body>

<div class="container">

<h1>KBank Top Up</h1>

<div class="balance">

<div class="balance-title">
ยอดเงินคงเหลือ
</div>

<div class="balance-value">
฿<span id="balance">0.00</span>
</div>

</div>

<input
    id="amount"
    type="number"
    min="1"
    step="0.01"
    placeholder="จำนวนเงิน"
>

<button onclick="createTopup()">
สร้างรายการเติมเงิน
</button>

<div
    class="qr-box"
    id="qrBox"
>

<div>
สแกน QR เพื่อโอนเงิน
</div>

<br>

<img
    id="qrImage"
    alt="KBank QR"
>

<div class="receiver">

ธนาคาร:
<b>KBank</b>

<br>

ผู้รับ:
<b id="receiverName">-</b>

<br>

เลขบัญชี:
<b id="receiverAccount">
2202587596
</b>

</div>

</div>

<div
    class="upload-box"
    id="uploadBox"
>

<input
    type="file"
    id="slip"
    accept="image/*"
>

<button onclick="verifySlip()">
ตรวจสอบสลิป
</button>

</div>

<div
    class="status"
    id="status"
></div>

</div>

<script>

let currentPaymentId = null;


/* =========================
   Status
========================= */

function setStatus(
    message,
    error = false,
    success = false
) {

    const element =
        document.getElementById("status");

    element.textContent =
        message;

    element.className =
        "status";

    if (error) {
        element.classList.add("error");
    }

    if (success) {
        element.classList.add("success");
    }

}


/* =========================
   Balance
========================= */

async function loadBalance() {

    try {

        const response =
            await fetch("/api/balance");

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error();
        }

        document.getElementById(
            "balance"
        ).textContent =
            Number(data.balance).toFixed(2);

    } catch {

        setStatus(
            "โหลดข้อมูลไม่สำเร็จ",
            true
        );

    }

}


/* =========================
   สร้างรายการ
========================= */

async function createTopup() {

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );

    if (!Number.isFinite(amount) || amount <= 0) {

        setStatus(
            "กรุณาใส่จำนวนเงิน",
            true
        );

        return;
    }

    try {

        setStatus(
            "กำลังสร้างรายการ..."
        );


        /* สร้าง Payment */

        const paymentResponse =
            await fetch(
                "/api/topup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        amount: amount
                    })
                }
            );


        const paymentData =
            await paymentResponse.json();


        if (!paymentResponse.ok) {

            setStatus(
                paymentData.error ||
                "สร้างรายการไม่สำเร็จ",
                true
            );

            return;
        }


        currentPaymentId =
            paymentData.payment.id;


        /* โหลดข้อมูล QR */

        const qrResponse =
            await fetch(
                "/api/qr"
            );


        const qrData =
            await qrResponse.json();


        if (!qrResponse.ok) {

            setStatus(
                qrData.error ||
                "ยังไม่มี QR รับเงิน",
                true
            );

            return;
        }


        /* แสดงข้อมูล */

        document.getElementById(
            "receiverName"
        ).textContent =
            qrData.name || "-";


        document.getElementById(
            "receiverAccount"
        ).textContent =
            qrData.account ||
            "2202587596";


        /*
         * แสดง QR ที่สร้างจาก KBank/K PLUS
         */

        document.getElementById(
            "qrImage"
        ).src =
            qrData.qr;


        document.getElementById(
            "qrBox"
        ).style.display =
            "block";


        document.getElementById(
            "uploadBox"
        ).style.display =
            "block";


        setStatus(
            "กรุณาโอนเงินแล้วอัปโหลดสลิป"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้",
            true
        );

    }

}


/* =========================
   ตรวจสลิป
========================= */

async function verifySlip() {

    const file =
        document.getElementById(
            "slip"
        ).files[0];


    if (!currentPaymentId) {

        setStatus(
            "กรุณาสร้างรายการก่อน",
            true
        );

        return;
    }


    if (!file) {

        setStatus(
            "กรุณาเลือกสลิป",
            true
        );

        return;
    }


    const formData =
        new FormData();


    formData.append(
        "slip",
        file
    );


    formData.append(
        "paymentId",
        currentPaymentId
    );


    try {

        setStatus(
            "กำลังตรวจสอบสลิป..."
        );


        const response =
            await fetch(
                "/api/verify-slip",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            setStatus(
                data.error ||
                "ตรวจสอบไม่สำเร็จ",
                true
            );

            return;
        }


        setStatus(
            "เติมเงินสำเร็จ",
            false,
            true
        );


        await loadBalance();


        document.getElementById(
            "slip"
        ).value = "";


        currentPaymentId = null;


    } catch {

        setStatus(
            "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้",
            true
        );

    }

}


loadBalance();

</script>

</body>

</html>
