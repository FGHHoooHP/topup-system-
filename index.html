<body>

<h1>Top Up</h1>

<div class="balance">
    <div class="balance-title">
        ยอดเงินคงเหลือ
    </div>

    <div class="balance-value">
        ฿<span id="balance">0.00</span>
    </div>
</div>

<input
    id="amount"
    type="number"
    min="1"
    step="0.01"
    placeholder="จำนวนเงิน"
>

<button onclick="createTopup()">
    สร้าง QR เติมเงิน
</button>

<div class="qr-box" id="qrBox">

    <div>
        สแกน QR เพื่อโอนเงิน
    </div>

    <br>

    <img id="qrImage" alt="PromptPay QR">

    <div class="receiver">
        ผู้รับ:
        <b id="receiverName">-</b>
        <br>

        PromptPay:
        <b id="receiverPromptpay">-</b>
    </div>

</div>

<div class="upload-box" id="uploadBox">

    <input
        type="file"
        id="slip"
        accept="image/*"
    >

    <button onclick="verifySlip()">
        ตรวจสอบสลิป
    </button>

```

</div>

<script>

let currentPaymentId = null;


/* โหลดเงิน */

async function loadBalance() {

    try {

        const response =
            await fetch("/api/balance");

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error();
        }

        document.getElementById(
            "balance"
        ).textContent =
            Number(data.balance).toFixed(2);

    } catch {

        setStatus(
            "โหลดข้อมูลไม่สำเร็จ",
            true
        );

    }

}


/* สร้างรายการ + QR จริง */

async function createTopup() {

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );

    if (!Number.isFinite(amount) || amount <= 0) {

        setStatus(
            "กรุณาใส่จำนวนเงิน",
            true
        );

        return;
    }

    try {

        setStatus(
            "กำลังสร้าง QR..."
        );

        /*
         * 1. สร้างรายการเติมเงิน
         */

        const topupResponse =
            await fetch(
                "/api/topup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        amount: amount
                    })
                }
            );

        const topupData =
            await topupResponse.json();

        if (!topupResponse.ok) {

            setStatus(
                topupData.error ||
                "สร้างรายการไม่สำเร็จ",
                true
            );

            return;
        }

        currentPaymentId =
            topupData.payment.id;


        /*
         * 2. ขอ PromptPay QR จริงจาก Backend
         */

        const qrResponse =
            await fetch(
                `/api/qr?amount=${encodeURIComponent(amount)}`
            );

        const qrData =
            await qrResponse.json();

        if (!qrResponse.ok) {

            setStatus(
                qrData.error ||
                "สร้าง QR ไม่สำเร็จ",
                true
            );

            return;
        }


        /*
         * 3. แสดงข้อมูลผู้รับ
         */

        document.getElementById(
            "receiverName"
        ).textContent =
            qrData.receiverName || "-";

        document.getElementById(
            "receiverPromptpay"
        ).textContent =
            qrData.promptpay || "-";


        /*
         * 4. แสดง QR จาก PromptPay Payload จริง
         */

        document.getElementById(
            "qrImage"
        ).src =
            "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
            encodeURIComponent(qrData.payload);


        /*
         * 5. แสดงกล่อง QR
         */

        document.getElementById(
            "qrBox"
        ).style.display =
            "block";


        /*
         * 6. แสดงช่องอัปโหลดสลิป
         */

        document.getElementById(
            "uploadBox"
        ).style.display =
            "block";


        setStatus(
            "สร้าง QR แล้ว กรุณาโอนเงินและอัปโหลดสลิป"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้",
            true
        );

    }

}


/* ตรวจสลิป */

async function verifySlip() {

    const file =
        document.getElementById(
            "slip"
        ).files[0];


    if (!currentPaymentId) {

        setStatus(
            "กรุณาสร้างรายการเติมเงินก่อน",
            true
        );

        return;
    }


    if (!file) {

        setStatus(
            "กรุณาเลือกสลิป",
            true
        );

        return;
    }


    const formData =
        new FormData();

    formData.append(
        "slip",
        file
    );

    formData.append(
        "paymentId",
        currentPaymentId
    );


    try {

        setStatus(
            "กำลังตรวจสอบสลิป..."
        );


        const response =
            await fetch(
                "/api/verify-slip",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            setStatus(
                data.error ||
                "ตรวจสอบไม่สำเร็จ",
                true
            );

            return;
        }


        setStatus(
            `เติมเงินสำเร็จ +฿${Number(
                data.amount
            ).toFixed(2)}`,
            false,
            true
        );


        await loadBalance();


        document.getElementById(
            "slip"
        ).value = "";


        currentPaymentId = null;

    } catch {

        setStatus(
            "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้",
            true
        );

    }

}


/* Status */

function setStatus(
    message,
    error = false,
    success = false
) {

    const element =
        document.getElementById(
            "status"
        );

    element.textContent =
        message;

    element.className =
        "status";

    if (error) {
        element.classList.add("error");
    }

    if (success) {
        element.classList.add("success");
    }

}


/* เริ่มต้น */

loadBalance();

</script>

</body>
</html>
