<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topup System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0f17;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            padding: 30px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #8b95a7;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #303b4d;
            border-radius: 10px;
            background: #0b111c;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #4f8cff;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            background: #2563eb;
            font-weight: bold;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .switch {
            margin-top: 18px;
            text-align: center;
            color: #8b95a7;
            cursor: pointer;
        }

        .switch span {
            color: #4f8cff;
        }

        .error {
            margin-top: 12px;
            color: #ff6b6b;
            text-align: center;
        }

        .success {
            margin-top: 12px;
            color: #4ade80;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .dashboard {
            width: 650px;
        }

        .balance {
            padding: 25px;
            border-radius: 15px;
            background: #0b111c;
            border: 1px solid #263244;
            margin-bottom: 20px;
        }

        .balance-title {
            color: #8b95a7;
        }

        .balance-value {
            font-size: 34px;
            font-weight: bold;
            margin-top: 8px;
        }

        .card {
            padding: 20px;
            background: #0b111c;
            border: 1px solid #263244;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .logout {
            background: #dc2626;
        }

        .logout:hover {
            background: #b91c1c;
        }

        .qr {
            width: 220px;
            display: block;
            margin: 15px auto;
            border-radius: 10px;
        }

        .transaction {
            padding: 12px 0;
            border-bottom: 1px solid #263244;
        }

        .transaction:last-child {
            border-bottom: 0;
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginPage">

    <h1>Login</h1>
    <div class="subtitle">เข้าสู่ระบบ</div>

    <input id="loginUsername" type="text" placeholder="Username">
    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="loginMessage"></div>

    <div class="switch" onclick="showRegister()">
        ยังไม่มีบัญชี? <span>Register</span>
    </div>

</div>


<!-- REGISTER -->
<div class="container hidden" id="registerPage">

    <h1>Register</h1>
    <div class="subtitle">สร้างบัญชีใหม่</div>

    <input id="registerUsername" type="text" placeholder="Username">
    <input id="registerPassword" type="password" placeholder="Password">

    <button onclick="register()">Register</button>

    <div id="registerMessage"></div>

    <div class="switch" onclick="showLogin()">
        มีบัญชีอยู่แล้ว? <span>Login</span>
    </div>

</div>


<!-- DASHBOARD -->
<div class="container dashboard hidden" id="dashboardPage">

    <h1>Dashboard</h1>

    <div class="subtitle">
        Welcome, <span id="username"></span>
    </div>

    <div class="balance">
        <div class="balance-title">ยอดเงิน</div>
        <div class="balance-value">
            ฿<span id="balance">0.00</span>
        </div>
    </div>

    <div class="card">

        <h3>เติมเงิน</h3>

        <input
            id="topupAmount"
            type="number"
            min="1"
            placeholder="จำนวนเงิน"
        >

        <button onclick="createTopup()">
            สร้างรายการเติมเงิน
        </button>

        <div id="topupMessage"></div>

    </div>


    <div class="card hidden" id="paymentBox">

        <h3>ชำระเงิน</h3>

        <img id="qrImage" class="qr">

        <p>
            จำนวนเงิน:
            <b>฿<span id="paymentAmount">0</span></b>
        </p>

        <p>
            เลขรายการ:
            <span id="paymentId"></span>
        </p>

        <input
            id="slip"
            type="file"
            accept="image/*"
        >

        <button onclick="verifySlip()">
            ตรวจสอบสลิป
        </button>

        <div id="slipMessage"></div>

    </div>


    <div class="card">

        <h3>ประวัติรายการ</h3>

        <div id="transactions">
            กำลังโหลด...
        </div>

    </div>


    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>


<script>

let currentPaymentId = null;


// =========================
// PAGE
// =========================

function showLogin() {

    document.getElementById("loginPage")
        .classList.remove("hidden");

    document.getElementById("registerPage")
        .classList.add("hidden");

    document.getElementById("dashboardPage")
        .classList.add("hidden");
}


function showRegister() {

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("registerPage")
        .classList.remove("hidden");

    document.getElementById("dashboardPage")
        .classList.add("hidden");
}


function showDashboard() {

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("registerPage")
        .classList.add("hidden");

    document.getElementById("dashboardPage")
        .classList.remove("hidden");

    loadUser();
    loadBalance();
    loadTransactions();
}


// =========================
// REGISTER
// =========================

async function register() {

    const username =
        document.getElementById("registerUsername").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const message =
        document.getElementById("registerMessage");

    message.className = "";
    message.textContent = "กำลังสมัคร...";

    try {

        const response = await fetch("/api/auth/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                password
            })

        });

        const data = await response.json();

        if (!response.ok) {

            message.className = "error";
            message.textContent =
                data.error || "สมัครสมาชิกไม่สำเร็จ";

            return;
        }

        message.className = "success";
        message.textContent =
            "สมัครสมาชิกสำเร็จ กำลังเข้าสู่ระบบ...";

        setTimeout(() => {

            showLogin();

            document.getElementById("loginUsername").value =
                username;

        }, 800);

    } catch (error) {

        message.className = "error";
        message.textContent = "เชื่อมต่อ Server ไม่สำเร็จ";

    }
}


// =========================
// LOGIN
// =========================

async function login() {

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    message.className = "";
    message.textContent = "กำลังเข้าสู่ระบบ...";

    try {

        const response = await fetch("/api/auth/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                password
            })

        });

        const data = await response.json();

        if (!response.ok) {

            message.className = "error";
            message.textContent =
                data.error || "เข้าสู่ระบบไม่สำเร็จ";

            return;
        }

        showDashboard();

    } catch (error) {

        message.className = "error";
        message.textContent =
            "เชื่อมต่อ Server ไม่สำเร็จ";

    }
}


// =========================
// USER
// =========================

async function loadUser() {

    const response =
        await fetch("/api/auth/me");

    if (!response.ok) {

        showLogin();
        return;
    }

    const data =
        await response.json();

    document.getElementById("username")
        .textContent = data.user.username;
}


// =========================
// BALANCE
// =========================

async function loadBalance() {

    const response =
        await fetch("/api/balance");

    if (!response.ok) return;

    const data =
        await response.json();

    document.getElementById("balance")
        .textContent =
        Number(data.balance).toFixed(2);
}


// =========================
// TOPUP
// =========================

async function createTopup() {

    const amount =
        Number(document.getElementById("topupAmount").value);

    const message =
        document.getElementById("topupMessage");

    if (!amount || amount <= 0) {

        message.className = "error";
        message.textContent =
            "กรุณาใส่จำนวนเงิน";

        return;
    }

    try {

        const response =
            await fetch("/api/topup", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    amount
                })

            });

        const data =
            await response.json();

        if (!response.ok) {

            message.className = "error";
            message.textContent =
                data.error || "สร้างรายการไม่สำเร็จ";

            return;
        }

        currentPaymentId =
            data.payment.id;

        document.getElementById("paymentId")
            .textContent =
            currentPaymentId;

        document.getElementById("paymentAmount")
            .textContent =
            Number(data.payment.amount).toFixed(2);

        document.getElementById("qrImage")
            .src = data.qrUrl;

        document.getElementById("paymentBox")
            .classList.remove("hidden");

        message.className = "success";
        message.textContent =
            "สร้างรายการเติมเงินแล้ว";

    } catch (error) {

        message.className = "error";
        message.textContent =
            "เชื่อมต่อ Server ไม่สำเร็จ";

    }
}


// =========================
// VERIFY SLIP
// =========================

async function verifySlip() {

    const file =
        document.getElementById("slip").files[0];

    const message =
        document.getElementById("slipMessage");

    if (!file) {

        message.className = "error";
        message.textContent =
            "กรุณาเลือกสลิป";

        return;
    }

    if (!currentPaymentId) {

        message.className = "error";
        message.textContent =
            "ไม่พบรายการเติมเงิน";

        return;
    }

    const formData =
        new FormData();

    formData.append("slip", file);

    formData.append(
        "paymentId",
        currentPaymentId
    );

    message.className = "";
    message.textContent =
        "กำลังตรวจสอบสลิป...";

    try {

        const response =
            await fetch("/api/verify-slip", {

                method: "POST",

                body: formData

            });

        const data =
            await response.json();

        if (!response.ok) {

            message.className = "error";
            message.textContent =
                data.error || "ตรวจสอบไม่สำเร็จ";

            return;
        }

        message.className = "success";
        message.textContent =
            "เติมเงินสำเร็จ!";

        await loadBalance();
        await loadTransactions();

    } catch (error) {

        message.className = "error";
        message.textContent =
            "เชื่อมต่อ Server ไม่สำเร็จ";

    }
}


// =========================
// TRANSACTIONS
// =========================

async function loadTransactions() {

    const box =
        document.getElementById("transactions");

    try {

        const response =
            await fetch("/api/transactions");

        if (!response.ok) {

            box.textContent =
                "โหลดข้อมูลไม่สำเร็จ";

            return;
        }

        const data =
            await response.json();

        if (!data.transactions ||
            data.transactions.length === 0) {

            box.textContent =
                "ยังไม่มีรายการ";

            return;
        }

        box.innerHTML =
            data.transactions.map(item => `

                <div class="transaction">

                    <div>
                        ฿${Number(item.amount).toFixed(2)}
                    </div>

                    <div>
                        สถานะ: ${item.status}
                    </div>

                    <small>
                        ${new Date(item.created_at)
                            .toLocaleString("th-TH")}
                    </small>

                </div>

            `).join("");

    } catch (error) {

        box.textContent =
            "โหลดข้อมูลไม่สำเร็จ";

    }
}


// =========================
// LOGOUT
// =========================

async function logout() {

    await fetch("/api/auth/logout", {
        method: "POST"
    });

    currentPaymentId = null;

    showLogin();
}


// =========================
// AUTO LOGIN
// =========================

async function checkSession() {

    try {

        const response =
            await fetch("/api/auth/me");

        if (response.ok) {

            showDashboard();

        } else {

            showLogin();

        }

    } catch {

        showLogin();

    }
}


checkSession();

</script>

</body>
</html>
